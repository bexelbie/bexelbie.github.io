  - title: "Slow Productivity: The Lost Art of Accomplishment Without Burnout"
    id: book-22
    url: "https://openlibrary.org/works/OL36996011W"
    cover: "https://covers.openlibrary.org/b/olid/OL49948382M-M.jpg"
    started: 2025-07-11
    finished: 2025-07-31
    audiobook: true
    comment: |-
      I couldn't find a copy of this to borrow that wasn't an audiobook.  The book is very pop-science feeling, as most of Cal Newport's writing feels too me.  Not being able to skim/review this book was frustrating and I think this experiment in audiobooks may mean I either never do it again or I stick exclusively to fiction audio books.  That said, I have taken notes on the book.  It is broken into three main ideas: Do Fewer Things; Work at a natural pace; and Obsess over quality.  The first two are ideas worth listening to and exploring.  If you can control your schedule/work, and most of us have way more control than we want to admit, then these ideas can help you actually get the work that matters done.  The third idea is one I am struggling with.  Even Cal doesn't seem to really know what he wants you take away from this.  I get the impression he had some vague feelings, possibly a page limit he needed to hit, and/or a bunch of awesome stories left over from his research.  Recommended by a friend, our discussions of this echoed a lot of this pop-science feel.  However, the author does say the quiet part out loud about a bunch of things.  In the end, I think this is actually fairly actionable, with work, by a mid-career and higher segment of knowledge workers, however they have to be comfortable with taking the risk of truly setting their own direction.  Given that this is a hallmark of what most organizations call Principal, it should be something that is easy to see demonstrated, but even Principals seem to hide behind performative or pseudo-productivity.

  - title: "Saturn Run"
    id: book-23
    url: "https://openlibrary.org/works/OL17274274W"
    cover: "https://covers.openlibrary.org/b/olid/OL27102662M-M.jpg"
    started: 2025-07-29
    finished: 2025-08-06
    audiobook: true
    comment: |
      The story was quite good.  The epilogue from the authors show they put a lot of thought into believable science, only papering over a hold in science in one place.  The rest holds true and gives the whole book a solid framework to hand the story from.  The book was authored in 2015 and feels both geopolitically out of step and inline with our current timeline.  The only fault I have found is that one plot element was obvious to me, but somehow missed by a character in a way that felt out of line, even the delivery was flat.  Additionally, the Chinese are portrayed in a way that, while perhaps real, stretches the imagination with how cliched it feels.  All of that said, it's a good read and I would recommend it.  However, it wasn't a read for me, it was an audiobook.  My 2nd audiobook, and likely my second-to-last audiobook (I am trying to give "The Goal" a fair shake.). According to the stats, I about 12.75 ours listensing to just over 16.5 hours of audio, which jives with my deliberate choice of 1.5x.  I am even more convinced that audiobooks are not a good fit for me.  I have little time to ilsten to them each day, can't listen to them while doing anything consequential, and am frustrated that I can't "keep reading" and feel silly doing nothing at home listening to an audiobook.  The one redeeming piece of the format is that it makes it harder for me to binge read and destroy my schedule.

  - title: "The goal"
    id: book-24
    url: "https://openlibrary.org/works/OL2463051W"
    cover: "https://covers.openlibrary.org/b/id/7262320-M.jpg"
    started: 2025-08-07
    finished: 2025-08-15
    audiobook: true
    comment: |
      This was recommended to me by the same friend who recommended *Slow Productivity*. He liked the enhanced audio edition as it is structured more like a radio drama and he thought I'd enjoy it as an audiobook even though non-fiction audiobooks seem like a bad fit for me.

      It was a great read and I found it engaging.  It was nice that I could treat it a bit like a tv show but that it also tied heavily back to lessons learned and developing them in a Socratic-style.  I had heard of Theory of Constraints before and it was lovely to discover the author was an academic using research to drive the narrative.  Many project and business books lack serious research grounding.

      While there are many great take aways in the book, I don't work in a production environment where touch time is short.  Knowledge projects are long touch time efforts.  That said, it turns out another book by the same author, *Critical Chain*, is more appropriate for my work, it seems.  I am putting it on the list.

      I really appreciated the big frameworks in the book so I have put them in a [blog post]({% post_url 2025-08-15-the-goal %})

  - title: "1632"
    id: book-27
    url: "https://openlibrary.org/works/OL17176W"
    cover: "https://covers.openlibrary.org/b/olid/OL50639M-M.jpg"
    started: 2026-07-04
    finished: 2026-07-09
    comment: |
      I started this as a beach read on vacation and paired it with Thinking, Fast and Slow. It was an easy read. It's basically an alternative history story about what happens if modern Americans get dropped into the past with modern technology. I haven't researched the author, so I don't know whether he is a wannabe historian, a serious researcher, or just someone who really likes writing alternative history.

      The characters are mostly one-dimensional, and when they do gain additional dimensions those tend to be very obvious tropes. It's very schlocky. It's also very rah-rah America and rah-rah the "working man."

      There's a lot of suspension of disbelief required to accept how these people keep their modern technology working. The book does pay some attention to the maintenance problem over time, but mostly leaves it as an exercise to the reader and expects the reader not to care. That said, I do salute the author for creating a genuine political problem around a gear-down in technology against the overwhelming numbers of the people they have landed among in the middle of the Thirty Years' War.

      The book has several challenges. The first is that the author's inability to write real women and real relationships produces a scene where a woman who has suffered abuse in the 1600s as a camp follower is mystically cured by love, marriage, and wedding-night sex with a modern man. If you can somehow put that aside, you then have to deal with the Holocaust being used as shorthand for why an American republic is critical, despite the fact that Germans at this point are far from a world power and no one really seems to understand that you have to be powerful to commit murder on that scale. The last is the combination of using Jews as a stand-in for basically every non-white, non-Christian group on the planet, with the exception of Black people, and the willingness to suggest that people from 1632, while not stupid or backward, would immediately learn a foreign language and grasp the importance of American values and ideals despite mostly coming from poverty.

      Eric Flint comments on his motivations in an afterword. He explains that he wrote this because common working folk, blue-collar workers, schoolteachers, and farmers rarely appear in modern fiction except as spear carriers or bigots. Based on Flint's disclosed past, I also think he sees himself in the main character and likely inserted himself as the hero who saves the world and gets the girl.

  - title: "Alas, Babylon"
    id: book-28
    url: "https://openlibrary.org/works/OL2003035W"
    cover: "https://covers.openlibrary.org/b/olid/OL10944289M-M.jpg"
    started: 2026-07-09
    finished: 2026-07-12
    comment: |
      I read this right after 1632. It's a good book, and it has aged reasonably well. It's a compelling read, and I think it mostly does a great job talking about post-apocalyptic survival within the relatively clean bubble the characters inhabit.

      Because I read it after 1632, and because I am from the southern United States, I couldn't help picking up on the subtle racism and stereotyping in the book. That felt more like the author's view of the world, or his desire to write about a very specific part of American society, than something necessary to further the story.

      Even so, it was a great read and I encourage people to pick it up. It does make you think about disaster scenarios from a more realistic perspective, at least in my opinion.

  - title: "The Alchemist"
    id: book-30
    url: "https://openlibrary.org/works/OL796465W"
    cover: "https://covers.openlibrary.org/b/id/45762-M.jpg"
    started: 2026-07-12
    finished: 2026-07-14
    comment: |
      I don't tend to read philosophy or poetry. Symbolism in literature has never come naturally to me. I do have a fond memory, though, of successfully arguingthat a Christ figure doesn't need to literally mirror the life of the Christian Jesus to qualify as one.
      
      I started this book after I finished "Alas Babylon," primarily because it was alphabetically next on my Kindle.  I had no idea what to expect beyond my partner's vague comment, "it's about mythology," which wound up not being terribly helpful.

      The story follows an, as far as I remember, unnamed shepherd (called "the boy" or "the shepherd" throughout) pursuing their "Personal Legend." Along the way they learn to listen, to become part of the world around them, and ultimately discover that all their power lies within. It's heady material, but it reads easily. Three passages particularly resonated:

      The first speaks to something I am starting to feel more and more:
      > "If you pay attention to the present, you can improve upon it. And, if you improve on the present, what comes later will also be better. Forget about the future, and live each day"

      The second is simply good humor:
      > "Usually the threat of death makes people a lot more aware of their lives."

      The third is one many cultures say, this one is quite nice:
      > "Everything that happens once can never happen again. But everything that happens twice will surely happen a third time."

